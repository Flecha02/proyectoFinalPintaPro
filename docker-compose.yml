services:
  db:
    image: mysql:8.0
    container_name: pintapro_db
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --lower-case-table-names=1
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: PintaPro
    ports:
      - "3307:3306"
    volumes:
      - pintapro_mysql_data:/var/lib/mysql
      - ./database_pintapro.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - pintapro-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: shoniro93/pintapro-backend:local
    container_name: pintapro_backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: PintaPro
      DB_PORT: 3306
      DB_SSL: "false"
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pintapro-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    image: shoniro93/pintapro-frontend:local
    container_name: pintapro_frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pintapro-net

networks:
  pintapro-net:
    driver: bridge

volumes:
  pintapro_mysql_data:
