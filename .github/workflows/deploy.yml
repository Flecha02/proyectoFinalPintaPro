name: Pipeline CI/CD PintaPro

on:
  push:
    branches:
      - main
      - dev-shoniro
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validar y Analizar Codigo
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validar sintaxis del backend
        run: |
          echo "Verificando sintaxis del backend..."
          node --check backend/index.js
          node --check backend/src/app.js
          echo "Sintaxis del backend correcta"

      - name: Instalar dependencias y validar TypeScript en frontend
        run: |
          echo "Verificando TypeScript del frontend..."
          cd frontend
          npm ci
          npx tsc --noEmit
          echo "Validacion de TypeScript correcta"

  build-and-push:
    name: Construir y Publicar Imagenes Docker
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen del Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pintapro-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pintapro-backend:${{ github.sha }}

      - name: Construir y publicar imagen del Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.163.192.145.126.nip.io/api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pintapro-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pintapro-frontend:${{ github.sha }}

  deploy:
    name: Despliegue Automatico en Dokploy
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Ejecutar Webhook de despliegue del Backend
        run: |
          echo "Desplegando Backend en Dokploy..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.DOKPLOY_BACKEND_WEBHOOK }}")
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 204 ]; then
            echo "Despliegue del Backend ejecutado correctamente (HTTP $STATUS)"
          else
            echo "Error al ejecutar despliegue del Backend (HTTP $STATUS)"
            exit 1
          fi

      - name: Ejecutar Webhook de despliegue del Frontend
        run: |
          echo "Desplegando Frontend en Dokploy..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.DOKPLOY_FRONTEND_WEBHOOK }}")
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 204 ]; then
            echo "Despliegue del Frontend ejecutado correctamente (HTTP $STATUS)"
          else
            echo "Error al ejecutar despliegue del Frontend (HTTP $STATUS)"
            exit 1
          fi
